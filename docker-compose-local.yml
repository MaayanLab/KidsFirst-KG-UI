# Local development Neo4j for the KidsFirst KG (separate from the CPTAC project).
#   docker compose -f docker-compose-local.yml up -d
# Then `npm run dev` connects via NEO4J_DEV_URL=bolt://localhost:7687.
# Not used for the cluster deployment (see docker-compose.yml).
name: kidsfirst-kg
services:
  neo4j:
    image: neo4j:5.19-community
    restart: unless-stopped
    environment:
      - NEO4J_PLUGINS=["apoc"]
      # only applied when the volume has no auth yet
      - NEO4J_AUTH=${NEO4J_USER}/${NEO4J_PASSWORD}
      - NEO4J_server_memory_heap_initial__size=1G
      - NEO4J_server_memory_heap_max__size=2G
      - NEO4J_server_memory_pagecache_size=1G
      - NEO4J_server_config_strict__validation_enabled=false
    ports:
      - 7687:7687
      - 7474:7474
    volumes:
      - kidsfirst-kg-neo4j-data:/data

volumes:
  kidsfirst-kg-neo4j-data:
    name: kidsfirst-kg-neo4j-data
    external: true
