version: '3.9'
services:
  kg:
    build:
      context: .
      dockerfile: ./Dockerfile.next
      # NEXT_PUBLIC_* are inlined at build time; values come from .env
      args:
        - NEXT_PUBLIC_HOST
        - NEXT_PUBLIC_PREFIX
        - NEXT_PUBLIC_ENRICHR_URL
        - NEXT_PUBLIC_GENESHOT_URL
        - NEXT_PUBLIC_COOKIE_NAME
        - NEXT_PUBLIC_GA_MEASUREMENT_ID
        - NEXT_PUBLIC_HOMEPAGE
        - NEXT_PUBLIC_SCHEMA
    # the cluster is x86; required when building on Apple Silicon
    platform: linux/amd64
    image: lilytaub/kidsfirst-kg:1.0.0
    x-kubernetes:
      imagePullPolicy: IfNotPresent
      annotations:
        maayanlab.cloud/ingress: https://kidsfirst-kg.k8s.maayanlab.cloud
    ports:
      - 3000:3000
    environment:
      - NEO4J_URL=bolt://kidsfirst-kg-neo4j:7687
      - NEO4J_USER
      - NEO4J_PASSWORD
      - TURL
      - TURL_URL
      - NEXT_PUBLIC_HOST
      - NEXT_PUBLIC_PREFIX
      - NEXT_PUBLIC_ENRICHR_URL
      - NEXT_PUBLIC_GENESHOT_URL
      - NEXT_PUBLIC_SCHEMA
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 1G

  kidsfirst-kg-neo4j:
    # pinned to match the local DB so neo4j-admin dump/load is compatible
    image: neo4j:5.19-community
    x-kubernetes:
      strategy:
        type: Recreate
      imagePullPolicy: IfNotPresent
    environment:
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_AUTH=${NEO4J_USER}/${NEO4J_PASSWORD}
      - NEO4J_server_memory_heap_initial__size=2G
      - NEO4J_server_memory_heap_max__size=2G
      - NEO4J_server_memory_pagecache_size=2G
      - NEO4J_server_config_strict__validation_enabled=false
    ports:
      - 7687:7687
      - 7474:7474
    volumes:
      - kidsfirst-kg-neo4j-data:/data
    deploy:
      resources:
        limits:
          memory: 6G
        reservations:
          memory: 4G

volumes:
  kidsfirst-kg-neo4j-data:
    x-kubernetes:
      size: 10Gi
      class: ceph-block

x-kubernetes:
  name: kidsfirst-kg
